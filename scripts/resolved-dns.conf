# H96 Max RK3528: надёжный DNS через systemd-resolved.
# Кладётся в /etc/systemd/resolved.conf.d/99-h96max.conf
#
# Зачем: по умолчанию в таких сборках /etc/resolv.conf может оказаться обычным
# файлом с вписанными вручную серверами. Тогда смена сети, обновление пакетов или
# NetworkManager перезаписывают настройку — и «интернет есть, а имена не резолвятся».
# Здесь DNS задан явно, с запасными серверами и кэшем, а /etc/resolv.conf ссылается
# на stub-резолвер 127.0.0.53.
[Resolve]
DNS=1.1.1.1 8.8.8.8
FallbackDNS=9.9.9.9 149.112.112.112
Cache=yes
CacheFromLocalhost=no
DNSStubListener=yes
